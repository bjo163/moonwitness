name: Dependency Lock Refresh

on:
  push:
    branches:
      - feature/deployment-hardening
    paths:
      - .github/workflows/lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deployment-hardening
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Add canonical Fastify 5 runtime dependency
        run: pnpm --filter @moon/server add fastify@^5.12.1
      - name: Commit deterministic manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff -- packages/moon-server/package.json pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/moon-server/package.json pnpm-lock.yaml
          git diff --cached --quiet && { echo "No dependency changes required."; exit 0; }
          git commit -m "fix(server): declare Fastify runtime dependency"
          git push origin HEAD:feature/deployment-hardening
