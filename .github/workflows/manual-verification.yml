name: Manual Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  python-services:
    name: Python Microservices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pytest httpx
      - name: Test Celestial Engine
        run: |
          cd services/celestial-engine
          PYTHONPATH=. pytest tests/
      - name: Test AI Agent
        run: |
          cd services/ai-agent
          PYTHONPATH=. pytest tests/

  e2e:
    name: Critical browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Moon packages
        run: pnpm --filter "@moon/*" build
      - run: pnpm --filter=@moon/testing exec playwright install --with-deps chromium
      - name: Start public and admin portals
        shell: bash
        run: |
          BOOTSTRAP_ADMIN_EMAIL=playwright-admin@invalid.example \
          BOOTSTRAP_ADMIN_PASSWORD=playwright-admin-password \
          pnpm dev:local > /tmp/moonwitness-stack.log 2>&1 &
          for url in http://127.0.0.1:3000 http://127.0.0.1:3001 http://127.0.0.1:4000/health/ready; do
            for attempt in {1..60}; do curl --fail --silent "$url" >/dev/null && break; sleep 2; done
            curl --fail --silent "$url" >/dev/null
          done
      - name: Run critical browser flows
        env:
          CI: 'true'
          PLAYWRIGHT_WEB_URL: http://127.0.0.1:3000
          PLAYWRIGHT_CC_URL: http://127.0.0.1:3001
          PLAYWRIGHT_ADMIN_EMAIL: playwright-admin@invalid.example
          PLAYWRIGHT_ADMIN_PASSWORD: playwright-admin-password
        run: pnpm test:e2e
      - name: Capture runtime evidence
        if: always()
        run: |
          mkdir -p .audit/runtime
          pnpm runtime:evidence > .audit/runtime/e2e-runtime-evidence.json || true
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            packages/moon-testing/test-results
            .audit/runtime/e2e-runtime-evidence.json
          if-no-files-found: ignore