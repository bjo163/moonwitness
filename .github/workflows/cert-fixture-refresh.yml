name: Certification Fixture Refresh

on:
  push:
    branches:
      - feature/deployment-hardening
    paths:
      - .github/workflows/cert-fixture-refresh.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deployment-hardening
          fetch-depth: 0
      - name: Align certification fixtures with current Witness models
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/certify-witness-graph-pg.ts')
          text = path.read_text()
          old = '''  const figure = await WxFigure.spawn(WxFigure, env, {
    entityId: musa.id,
    name: "Musa",
    canonicalKey: "cert:figure:musa:profile",
    active: true,
  })

  await WxFigureName.spawn(WxFigureName, env, {
    figureId: figure.id,
    name: "Musa ibn Imran",
    provenanceId: provenance.id,
    sourceReference: "Qur’anic lineage tradition",
    active: true,
  })

  await WxFigureRole.spawn(WxFigureRole, env, {
    figureId: figure.id,
    roleCode: "PROPHET",
    provenanceId: provenance.id,
    sourceReference: "Qur’an 19:51",
    active: true,
  })

  const traditionCorpus = await WxTraditionCorpus.spawn(WxTraditionCorpus, env, {
    title: "Sahih Al-Bukhari Fixture",
    traditionType: "HADITH",
    authoritySourceId: source.id,
    active: true,
  })

  const traditionUnit = await WxTraditionUnit.spawn(WxTraditionUnit, env, {
    corpusId: traditionCorpus.id,
    stableKey: "cert:hadith:unit:1",
    active: true,
  })

  await WxTraditionReference.spawn(WxTraditionReference, env, {
    unitId: traditionUnit.id,
    stableKey: "bukhari:1:1",
    provenanceId: provenance.id,
    active: true,
  })

  await WxTraditionAttribution.spawn(WxTraditionAttribution, env, {
    unitId: traditionUnit.id,
    figureId: figure.id,
    roleCode: "PRIMARY_TRANSMITTER",
    provenanceId: provenance.id,
    active: true,
  })

  const traditionChain = await WxTransmissionChain.spawn(WxTransmissionChain, env, {
    traditionUnitId: traditionUnit.id,
    chainType: "ISNAD_CONTINUOUS",
    provenanceId: provenance.id,
    active: true,
  })

  await WxTransmissionLink.spawn(WxTransmissionLink, env, {
    chainId: traditionChain.id,
    sequence: 1,
    personEntityId: musa.id,
    transmissionMode: "DIRECT_HEARING",
    active: true,
  })

  await WxTraditionAssessment.spawn(WxTraditionAssessment, env, {
    traditionUnitId: traditionUnit.id,
    assessmentScheme: "HADITH_AUTHENTICITY",
    rawValue: "SAHIH",
    provenanceId: provenance.id,
    active: true,
  })
'''
          new = '''  const figure = await WxFigure.spawn(WxFigure, env, {
    entityId: musa.id,
    stableKey: "cert:figure:musa:profile",
    name: "Musa",
    provenanceId: provenance.id,
    status: "VERIFIED",
    active: true,
  })

  await WxFigureName.spawn(WxFigureName, env, {
    figureId: figure.id,
    name: "Musa ibn Imran",
    normalizedName: "musa ibn imran",
    nameType: "CANONICAL",
    sourceId: source.id,
    provenanceId: provenance.id,
    active: true,
  })

  await WxFigureRole.spawn(WxFigureRole, env, {
    figureId: figure.id,
    roleCode: "PROPHET",
    sourceId: source.id,
    provenanceId: provenance.id,
    certainty: "ESTABLISHED",
    status: "VERIFIED",
    active: true,
  })

  const traditionCorpusEntity = await WxEntity.spawn(WxEntity, env, {
    canonicalKey: "cert:tradition:corpus:bukhari",
    kind: "COMMUNITY",
    label: "Sahih Al-Bukhari Certification Fixture",
    active: true,
  })
  const traditionCorpus = await WxTraditionCorpus.spawn(WxTraditionCorpus, env, {
    entityId: traditionCorpusEntity.id,
    stableKey: "cert:tradition:corpus:bukhari",
    name: "Sahih Al-Bukhari Fixture",
    traditionType: "HADITH",
    sourceId: source.id,
    provenanceId: provenance.id,
    status: "VERIFIED",
    active: true,
  })

  const traditionUnitEntity = await WxEntity.spawn(WxEntity, env, {
    canonicalKey: "cert:tradition:unit:bukhari:1",
    kind: "PASSAGE",
    label: "Sahih Al-Bukhari Certification Unit 1",
    active: true,
  })
  const traditionUnit = await WxTraditionUnit.spawn(WxTraditionUnit, env, {
    entityId: traditionUnitEntity.id,
    corpusId: traditionCorpus.id,
    unitType: "REPORT",
    stableKey: "cert:hadith:unit:1",
    sequence: 1,
    sourceId: source.id,
    provenanceId: provenance.id,
    status: "VERIFIED",
    active: true,
  })

  await WxTraditionReference.spawn(WxTraditionReference, env, {
    unitId: traditionUnit.id,
    corpusId: traditionCorpus.id,
    sourceId: source.id,
    localNumber: "1",
    referenceScheme: "BUKHARI",
    stableKey: "bukhari:1:1",
    provenanceId: provenance.id,
    active: true,
  })

  await WxTraditionAttribution.spawn(WxTraditionAttribution, env, {
    unitId: traditionUnit.id,
    figureId: figure.id,
    roleCode: "PRIMARY_TRANSMITTER",
    sourceId: source.id,
    provenanceId: provenance.id,
    status: "RESOLVED",
    active: true,
  })

  const traditionChain = await WxTransmissionChain.spawn(WxTransmissionChain, env, {
    traditionUnitId: traditionUnit.id,
    chainType: "ISNAD_CONTINUOUS",
    sourceId: source.id,
    provenanceId: provenance.id,
    status: "VERIFIED",
    active: true,
  })

  await WxTransmissionLink.spawn(WxTransmissionLink, env, {
    chainId: traditionChain.id,
    sequence: 1,
    figureId: figure.id,
    roleMode: "DIRECT_HEARING",
    provenanceId: provenance.id,
    active: true,
  })

  await WxTraditionAssessment.spawn(WxTraditionAssessment, env, {
    traditionUnitId: traditionUnit.id,
    assessmentScheme: "HADITH_AUTHENTICITY",
    authoritySourceId: source.id,
    rawValue: "SAHIH",
    normalizedCategory: "AUTHENTIC",
    provenanceId: provenance.id,
    status: "VERIFIED",
    active: true,
  })
'''
          if old not in text:
              raise SystemExit('Expected stale certification fixture block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- apps/api/src/certify-witness-graph-pg.ts
      - name: Commit fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/certify-witness-graph-pg.ts
          git diff --cached --quiet && { echo "No fixture changes required."; exit 0; }
          git commit -m "fix(cert): align Witness PostgreSQL fixtures with current models"
          git push origin HEAD:feature/deployment-hardening
