name: Schema Diff Refresh

on:
  push:
    branches:
      - feature/deployment-hardening
    paths:
      - .github/workflows/schema-diff-refresh.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: moonwitness
          POSTGRES_PASSWORD: moonwitness
          POSTGRES_DB: moonwitness
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://moonwitness:moonwitness@127.0.0.1:5432/moonwitness
      JWT_SECRET: schema-diff-only-secret-32chars
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deployment-hardening
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Moon packages
        run: pnpm --filter "@moon/*" build
      - name: Apply reviewed migration history only
        run: pnpm --filter api db:migrate
      - name: Generate registry-to-database migration diff
        run: pnpm --filter api exec tsx src/migrate.ts diff
      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff -- apps/api/migrations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/migrations
          git diff --cached --quiet && { echo "No schema drift detected."; exit 0; }
          git commit -m "fix(db): migrate current registry schema from zero state"
          git push origin HEAD:feature/deployment-hardening
