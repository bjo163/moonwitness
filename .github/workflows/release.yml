name: Auto Release

on:
  workflow_run:
    workflows: ["Foundation CI"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Promote, Bump, and Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'dev')
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promote dev into main
        run: |
          set -euo pipefail
          git fetch origin main dev
          git checkout main
          git reset --hard origin/main
          git merge --no-ff -X theirs origin/dev -m "chore(promote): merge dev into main"
          git push origin main

      - name: Bump patch version and tag
        id: bump
        run: |
          set -euo pipefail
          NEW=$(node -e "const v=require('./package.json').version.split('.'); v[2]=Number(v[2])+1; console.log(v.join('.'))")
          if git rev-parse -q --verify "refs/tags/v${NEW}" >/dev/null; then
            echo "Tag v${NEW} already exists; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm version "${NEW}" -m "chore(release): v%s [skip ci]"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
          git push origin main
          git push origin "v${NEW}"

      - name: Create GitHub Release
        if: steps.bump.outputs.skip != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: MoonWitness ${{ steps.bump.outputs.tag }}
          generate_release_notes: true

      - name: Sync release back to dev
        if: steps.bump.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git push origin main:dev
