name: Foundation CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  audit:
    name: Constitutional & UI Audit
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Constitutional & Enterprise UI Audit
        run: pnpm audit:rules
      - name: UMBRELLA v6 Contract Validation
        run: pnpm audit:umbrella:validate

  lint:
    name: Lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Moon packages for type resolution
        run: pnpm --filter "@moon/*" build
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Moon packages for test resolution
        run: pnpm --filter "@moon/*" build
      - run: pnpm test

  build:
    name: Build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  umbrella:
    name: UMBRELLA v6 Evidence
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs: [audit, lint, typecheck, test, build]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect exact-SHA GitHub evidence
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('.audit/config/evidence.v1.json', 'utf8'));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const candidateSha = process.env.CANDIDATE_SHA;
            const branches = {};
            for (const branch of config.github.required_branches) {
              try {
                const response = await github.rest.repos.getBranch({ owner, repo, branch });
                branches[branch] = { protected: Boolean(response.data.protected) };
              } catch (error) {
                core.warning(`Unable to read branch ${branch}: ${error.message}`);
                branches[branch] = { protected: null };
              }
            }
            const issues = {};
            for (const tracker of config.github.tracked_issues) {
              try {
                const response = await github.rest.issues.get({ owner, repo, issue_number: tracker.number });
                issues[String(tracker.number)] = { state: response.data.state };
              } catch (error) {
                core.warning(`Unable to read issue #${tracker.number}: ${error.message}`);
                issues[String(tracker.number)] = { state: 'unknown' };
              }
            }
            let certification = { status: 'missing', conclusion: null };
            try {
              const response = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, head_sha: candidateSha, per_page: 100 });
              const matches = response.data.workflow_runs
                .filter((run) => run.name === config.github.certification_workflow && run.head_sha === candidateSha)
                .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
              if (matches[0]) certification = { status: matches[0].status, conclusion: matches[0].conclusion };
            } catch (error) {
              core.warning(`Unable to read certification workflow: ${error.message}`);
            }
            const evidence = {
              repository: `${owner}/${repo}`,
              source_revision: candidateSha,
              foundation: {
                audit: process.env.AUDIT_RESULT,
                lint: process.env.LINT_RESULT,
                typecheck: process.env.TYPECHECK_RESULT,
                test: process.env.TEST_RESULT,
                build: process.env.BUILD_RESULT,
              },
              certification,
              branches,
              issues,
            };
            fs.mkdirSync('.audit/runtime', { recursive: true });
            fs.writeFileSync('.audit/runtime/ci-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
      - name: Generate and validate UMBRELLA evidence report
        run: pnpm audit:umbrella:ci

  report:
    name: Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [audit, lint, typecheck, test, build, umbrella]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const checks = {
              'Constitutional & UI Audit': '${{ needs.audit.result }}',
              'Lint': '${{ needs.lint.result }}',
              'Typecheck': '${{ needs.typecheck.result }}',
              'Test': '${{ needs.test.result }}',
              'Build': '${{ needs.build.result }}',
              'UMBRELLA v6 Evidence': '${{ needs.umbrella.result }}',
            };
            const icon = (result) => result === 'success' ? '✅ passed' : result === 'cancelled' ? '⛔ cancelled' : '❌ failed';
            const allPassed = Object.values(checks).every((result) => result === 'success');
            const rows = Object.entries(checks).map(([name, result]) => `| ${name} | ${icon(result)} |`).join('\n');
            const body = `${allPassed ? '## ✅ Foundation CI Passed' : '## ❌ Foundation CI — Action Required'}\n\n| Check | Status |\n|---|---|\n${rows}\n\n${allPassed ? '> All release checks passed.' : '> Every Foundation CI check is blocking. Resolve failures before promotion.'}\n\n— *MoonWitness Foundation CI · Run #${{ github.run_id }}*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
