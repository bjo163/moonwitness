name: Foundation CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  audit:
    name: Constitutional & UI Audit
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Constitutional & Enterprise UI Audit
        run: pnpm audit:rules
      - name: Universal Contract Drift Verification
        run: pnpm contracts:verify
      - name: UMBRELLA v6 Contract Validation
        run: pnpm audit:umbrella:validate

  lint:
    name: Lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Moon packages for type resolution
        run: pnpm --filter "@moon/*" build
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Moon packages for test resolution
        run: pnpm --filter "@moon/*" build
      - run: pnpm test

  build:
    name: Build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  python-services:
    name: Python Microservices
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pytest httpx
      - name: Test Celestial Engine
        run: |
          cd services/celestial-engine
          PYTHONPATH=. pytest tests/
      - name: Test AI Agent
        run: |
          cd services/ai-agent
          PYTHONPATH=. pytest tests/

  report:
    name: Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [audit, lint, typecheck, test, build, python-services]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const checks = {
              'Constitutional & UI Audit': '${{ needs.audit.result }}',
              'Lint': '${{ needs.lint.result }}',
              'Typecheck': '${{ needs.typecheck.result }}',
              'Test': '${{ needs.test.result }}',
              'Build': '${{ needs.build.result }}',
              'Python Microservices': '${{ needs.python-services.result }}',
            };
            const icon = (result) => result === 'success' ? '✅ passed' : result === 'cancelled' ? '⛔ cancelled' : '❌ failed';
            const allPassed = Object.values(checks).every((result) => result === 'success');
            const rows = Object.entries(checks).map(([name, result]) => `| ${name} | ${icon(result)} |`).join('\n');
            const body = `${allPassed ? '## ✅ Foundation CI Passed' : '## ❌ Foundation CI — Action Required'}\n\n| Check | Status |\n|---|---|\n${rows}\n\n${allPassed ? '> All Foundation checks passed. Exact-SHA UMBRELLA replay certification is enforced by the dedicated UMBRELLA v6 Certification workflow.' : '> Every Foundation CI check is blocking. Resolve failures before promotion.'}\n\n— *MoonWitness Foundation CI · Run #${{ github.run_id }}*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

