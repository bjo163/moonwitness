name: Witness PostgreSQL Certification

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
      - 'feature/**'
    paths:
      - 'packages/moon-witness/**'
      - 'packages/moon-orm/**'
      - 'packages/moon-base/**'
      - 'apps/api/**'
      - '.github/workflows/witness-postgres-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witness-pg-cert-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-postgres:
    name: PostgreSQL 16 Graph Certification
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: test
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgres://postgres:postgres@127.0.0.1:5432/moonwitness_witness_cert' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure PostgreSQL is ready
        shell: bash
        run: |
          echo "Checking PostgreSQL connection..."
          if ! pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
            echo "Starting PostgreSQL container on runner..."
            docker run -d --rm --name moonwitness-pg-cert -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=moonwitness_witness_cert -p 5432:5432 postgres:16 || true
            sleep 5
          fi

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Moon packages
        run: pnpm --filter "@moon/*" build

      - name: Certify Witness graph on PostgreSQL
        run: pnpm --filter api certify:witness-graph-pg
