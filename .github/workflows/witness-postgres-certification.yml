name: Witness PostgreSQL Certification

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "packages/moon-witness/**"
      - "packages/moon-orm/**"
      - "packages/moon-base/**"
      - "apps/api/**"
      - ".github/workflows/witness-postgres-certification.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witness-pg-cert-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-postgres:
    name: PostgreSQL 16 Graph Certification
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: test
      JWT_SECRET: certification-only-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start isolated PostgreSQL certification container
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null || { echo "Docker is required on the self-hosted runner."; exit 1; }
          docker rm -f moonwitness-pg-cert >/dev/null 2>&1 || true
          docker run -d --rm --name moonwitness-pg-cert \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=moonwitness_witness_cert \
            -p 127.0.0.1::5432 postgres:16

          for attempt in $(seq 1 60); do
            container_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' moonwitness-pg-cert 2>/dev/null || true)"
            if [ -n "$container_ip" ] \
              && docker exec moonwitness-pg-cert pg_isready -U postgres -d moonwitness_witness_cert >/dev/null 2>&1 \
              && timeout 2 bash -c "</dev/tcp/$container_ip/5432" >/dev/null 2>&1; then
              database_url="postgres://postgres:postgres@$container_ip:5432/moonwitness_witness_cert"
              echo "PostgreSQL is ready on $container_ip:5432"
              echo "TEST_DATABASE_URL=$database_url" >> "$GITHUB_ENV"
              echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for PostgreSQL container/bridge endpoint (attempt $attempt/60)..."
            sleep 1
          done
          docker logs moonwitness-pg-cert || true
          exit 1

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Moon packages
        run: pnpm --filter "@moon/*" build

      - name: Verify migrations and canonical seed
        run: pnpm --filter api db:verify

      - name: Certify Witness graph on PostgreSQL
        run: pnpm --filter api certify:witness-graph-pg

      - name: Stop PostgreSQL certification container
        if: always()
        shell: bash
        run: docker rm -f moonwitness-pg-cert >/dev/null 2>&1 || true
