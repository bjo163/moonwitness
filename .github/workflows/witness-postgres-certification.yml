name: Witness PostgreSQL Certification

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "packages/moon-witness/**"
      - "packages/moon-orm/**"
      - "packages/moon-base/**"
      - "apps/api/**"
      - ".github/workflows/witness-postgres-certification.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witness-pg-cert-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-postgres:
    name: PostgreSQL 16 Graph Certification
    # This workflow intentionally does not run on pull_request events: it uses a
    # self-hosted runner and must never execute untrusted fork code with access
    # to the runner or repository configuration.
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET: certification-only-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure PostgreSQL is ready
        shell: bash
        run: |
          if [ -n "${TEST_DATABASE_URL:-}" ]; then
            echo "Using TEST_DATABASE_URL supplied by repository secret."
            echo "DATABASE_URL=$TEST_DATABASE_URL" >> "$GITHUB_ENV"
            exit 0
          fi
          command -v docker >/dev/null || { echo "Docker is required when TEST_DATABASE_URL is not configured."; exit 1; }
          docker rm -f moonwitness-pg-cert >/dev/null 2>&1 || true
          echo "Starting isolated PostgreSQL certification container on a dynamic host port..."
          docker run -d --rm --name moonwitness-pg-cert \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=moonwitness_witness_cert \
            -p 127.0.0.1::5432 postgres:16
          for attempt in $(seq 1 60); do
            mapped_port="$(docker inspect -f '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' moonwitness-pg-cert 2>/dev/null || true)"
            if [ -n "$mapped_port" ] && docker exec moonwitness-pg-cert pg_isready -U postgres -d moonwitness_witness_cert >/dev/null 2>&1 \
              && timeout 2 bash -c "</dev/tcp/127.0.0.1/$mapped_port" >/dev/null 2>&1; then
              echo "PostgreSQL is ready on 127.0.0.1:$mapped_port"
              echo "TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:$mapped_port/moonwitness_witness_cert" >> "$GITHUB_ENV"
              echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:$mapped_port/moonwitness_witness_cert" >> "$GITHUB_ENV"
              echo "MOONWITNESS_PG_STARTED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for PostgreSQL container/host port (attempt $attempt/60)..."
            sleep 1
          done
          docker logs moonwitness-pg-cert || true
          exit 1

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Moon packages
        run: pnpm --filter "@moon/*" build

      - name: Verify migrations and canonical seed
        run: pnpm --filter api db:verify

      - name: Certify Witness graph on PostgreSQL
        run: pnpm --filter api certify:witness-graph-pg

      - name: Stop PostgreSQL certification container
        if: always()
        shell: bash
        run: |
          if [ "${MOONWITNESS_PG_STARTED:-}" = "true" ] && command -v docker >/dev/null 2>&1; then
            docker rm -f moonwitness-pg-cert >/dev/null 2>&1 || true
          fi
