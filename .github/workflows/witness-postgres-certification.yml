name: Witness PostgreSQL Certification

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "packages/moon-witness/**"
      - "packages/moon-orm/**"
      - "packages/moon-base/**"
      - "apps/api/**"
      - ".github/workflows/witness-postgres-certification.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witness-pg-cert-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-postgres:
    name: PostgreSQL 16 Graph Certification
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: test
      JWT_SECRET: certification-only-test-secret
      CERT_NETWORK: moonwitness-cert-${{ github.run_id }}
      CERT_PG_CONTAINER: moonwitness-pg-cert-${{ github.run_id }}
      CERT_APP_CONTAINER: moonwitness-app-cert-${{ github.run_id }}
      CERT_IMAGE: moonwitness-api-cert:${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start isolated PostgreSQL certification network
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null || { echo "Docker is required on the self-hosted runner."; exit 1; }
          docker network create "$CERT_NETWORK"
          docker run -d --rm \
            --name "$CERT_PG_CONTAINER" \
            --network "$CERT_NETWORK" \
            --network-alias postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=moonwitness_witness_cert \
            postgres:16

          for attempt in $(seq 1 60); do
            if docker exec "$CERT_PG_CONTAINER" \
              pg_isready -U postgres -d moonwitness_witness_cert >/dev/null 2>&1; then
              echo "PostgreSQL is healthy inside $CERT_NETWORK."
              exit 0
            fi
            echo "Waiting for PostgreSQL health check (attempt $attempt/60)..."
            sleep 1
          done
          docker logs "$CERT_PG_CONTAINER" || true
          exit 1

      - name: Build certification image
        shell: bash
        run: docker build --file apps/api/Dockerfile --tag "$CERT_IMAGE" .

      - name: Verify migrations, seed, and Witness graph
        shell: bash
        run: |
          docker run --rm \
            --name "$CERT_APP_CONTAINER" \
            --network "$CERT_NETWORK" \
            -e CI=true \
            -e NODE_ENV=test \
            -e JWT_SECRET="$JWT_SECRET" \
            -e TEST_DATABASE_URL=postgres://postgres:postgres@postgres:5432/moonwitness_witness_cert \
            -e DATABASE_URL=postgres://postgres:postgres@postgres:5432/moonwitness_witness_cert \
            "$CERT_IMAGE" \
            sh -lc 'pnpm --filter api db:verify && pnpm --filter api certify:witness-graph-pg'

      - name: Clean certification containers and network
        if: always()
        shell: bash
        run: |
          docker rm -f "$CERT_APP_CONTAINER" >/dev/null 2>&1 || true
          docker rm -f "$CERT_PG_CONTAINER" >/dev/null 2>&1 || true
          docker network rm "$CERT_NETWORK" >/dev/null 2>&1 || true
          docker image rm "$CERT_IMAGE" >/dev/null 2>&1 || true
