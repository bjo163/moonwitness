name: Passage Certification Fixture Refresh

on:
  push:
    branches:
      - feature/deployment-hardening
    paths:
      - .github/workflows/cert-passage-refresh.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deployment-hardening
          fetch-depth: 0
      - name: Align passage fixture with canonical graph models
        shell: bash
        env:
          OLD_IMPORT_B64: ICBXeFJlbGlnaW9uLAogIFd4U291cmNlLAo=
          NEW_IMPORT_B64: ICBXeFJlbGlnaW9uLAogIFd4U2NyaXB0dXJlLAogIFd4UGFzc2FnZSwKICBXeFNvdXJjZSwK
          OLD_PASSAGE_B64: 
          NEW_PASSAGE_B64: 
        run: |
          python <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('apps/api/src/certify-witness-graph-pg.ts')
          text = path.read_text()
          pairs = [
            ('OLD_IMPORT_B64', 'NEW_IMPORT_B64'),
            ('OLD_PASSAGE_B64', 'NEW_PASSAGE_B64'),
          ]
          for old_key, new_key in pairs:
            old = base64.b64decode(os.environ[old_key]).decode()
            new = base64.b64decode(os.environ[new_key]).decode()
            if old not in text:
              raise SystemExit(f'Expected fixture fragment not found: {old_key}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/api/src/certify-witness-graph-pg.ts
      - name: Commit fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/certify-witness-graph-pg.ts
          git diff --cached --quiet && { echo "No fixture changes required."; exit 0; }
          git commit -m "fix(cert): use canonical passage records in graph fixture"
          git push origin HEAD:feature/deployment-hardening
