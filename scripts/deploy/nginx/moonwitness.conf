# ◈ MOONWITNESS OS V9.5 — ENTERPRISE NGINX REVERSE PROXY CONFIGURATION
# Designed for high-throughput Next.js 16 portals & Realtime SSE Telemetry

# Upstream Backend Pools
upstream mw_web_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream mw_command_upstream {
    server 127.0.0.1:3001;
    keepalive 64;
}

upstream mw_api_upstream {
    server 127.0.0.1:4000;
    keepalive 64;
}

# ── 1. HTTP TO HTTPS GLOBAL REDIRECTION ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name moonwitness.os command.moonwitness.os api.moonwitness.os;
    return 301 https://$host$request_uri;
}

# ── 2. PUBLIC COSMIC PORTAL (https://moonwitness.os) ──────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moonwitness.os;

    # SSL Certificates (Configure paths according to your environment)
    ssl_certificate /etc/letsencrypt/live/moonwitness.os/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moonwitness.os/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static Asset Caching
    location /_next/static/ {
        proxy_pass http://mw_web_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://mw_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 3. TACTICAL COMMAND CENTER (https://command.moonwitness.os) ────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name command.moonwitness.os;

    ssl_certificate /etc/letsencrypt/live/moonwitness.os/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moonwitness.os/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /_next/static/ {
        proxy_pass http://mw_command_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://mw_command_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 4. BACKEND API & REALTIME SSE (https://api.moonwitness.os) ─────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.moonwitness.os;

    ssl_certificate /etc/letsencrypt/live/moonwitness.os/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moonwitness.os/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # Unbuffered SSE Streaming Endpoint
    location ~* ^/api/(stream|telemetry|sse) {
        proxy_pass http://mw_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for instant real-time telemetry
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://mw_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
