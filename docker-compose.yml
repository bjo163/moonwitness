version: '3.8'

services:
  # ── DATABASE & CACHE ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-moonwitness}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mw_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── MOONWITNESS BACKEND SERVICE ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mw_api
    restart: unless-stopped
    command: ["node", "apps/api/dist/server.js"]
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/moonwitness
      JWT_SECRET: ${JWT_SECRET:-production_secure_matrix_secret_1449}
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── COMMAND CENTER PORTAL ───────────────────────────────────────────────────
  command-center:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mw_command_center
    restart: unless-stopped
    command: ["pnpm", "--filter", "command-center", "start"]
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - "3001:3001"
    depends_on:
      - api

  # ── PUBLIC COSMIC PORTAL ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mw_web
    restart: unless-stopped
    command: ["pnpm", "--filter", "web", "start"]
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
