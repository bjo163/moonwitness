version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000"
    restart: unless-stopped
    env_file:
      - apps/api/.env

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000"
    restart: unless-stopped
    env_file:
      - apps/web/.env
    environment:
      - WEB_PORT=${WEB_PORT:-3000}
      - PORT=${WEB_PORT:-3000}
      - NEXT_PUBLIC_API_URL=http://api:${API_PORT:-4000}
