version: '3.8'

services:
  postgres:
    image: postgres:18-pgvector
    container_name: mw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c \"SELECT 1 FROM pg_available_extensions WHERE extname='pgvector';\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  redis:
    image: redis:7-alpine
    container_name: mw_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mw_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env.production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.production}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set in .env.production}
      CELESTIAL_ENGINE_URL: ${CELESTIAL_ENGINE_URL:-http://celestial-engine:8001}
      AI_AGENT_URL: ${AI_AGENT_URL:-http://ai-agent:8002}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data

  celestial-engine:
    build:
      context: .
      dockerfile: services/celestial-engine/Dockerfile
    container_name: mw_celestial_engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CELESTIAL_ENGINE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  ai-agent:
    build:
      context: .
      dockerfile: services/ai-agent/Dockerfile
    container_name: mw_ai_agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_AGENT_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  command-center:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set in .env.production}
    container_name: mw_command_center
    restart: unless-stopped
    command: ["pnpm", "--filter", "command-center", "start"]
    environment:
      NODE_ENV: production
      PORT: 3001
      MOON_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set in .env.production}
    ports:
      - "127.0.0.1:${COMMAND_CENTER_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set in .env.production}
    container_name: mw_web
    restart: unless-stopped
    command: ["pnpm", "--filter", "web", "start"]
    environment:
      NODE_ENV: production
      PORT: 3000
      MOON_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set in .env.production}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app

volumes:
  postgres_data:
  redis_data:

networks:
  app:
  data:
    internal: true
