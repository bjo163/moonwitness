version: '3.8'

services:
  # ── DATABASE & CACHE ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  redis:
    image: redis:7-alpine
    container_name: mw_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  # ── MOONWITNESS BACKEND SERVICE ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mw_api
    restart: unless-stopped
    command: ["node", "apps/api/dist/server.js"]
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env.production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.production}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set in .env.production}
    ports:
      - "127.0.0.1:${PORT_API:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data

  # ── COMMAND CENTER PORTAL ───────────────────────────────────────────────────
  command-center:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mw_command_center
    restart: unless-stopped
    command: ["pnpm", "--filter", "command-center", "start"]
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - "127.0.0.1:${PORT_COMMAND_CENTER:-3001}:3001"
    depends_on:
      - api
    networks:
      - app

  # ── PUBLIC COSMIC PORTAL ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mw_web
    restart: unless-stopped
    command: ["pnpm", "--filter", "web", "start"]
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - "127.0.0.1:${PORT_WEB:-3000}:3000"
    depends_on:
      - api
    networks:
      - app

volumes:
  postgres_data:
  redis_data:

networks:
  app:
  data:
    internal: true
